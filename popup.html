<!DOCTYPE html>
<html>

<head>
  <title>HRMS Calculator</title>
  <style>
    body {
      width: 300px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background-color: #f9f9f9;
    }

    h1 {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #005a9e;
    }

    #result {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      background-color: #fff;
      border: 1px solid #ddd;
      font-size: 14px;
      color: #555;
      min-height: 20px;
    }

    .error {
      color: #d13438;
      background-color: #fde7e9;
      border-color: #fde7e9;
    }

    .success {
      color: #107c10;
      background-color: #dff6dd;
      border-color: #dff6dd;
    }
  </style>
</head>

<body>
  <h1>HRMS Time Calculator</h1>
  <button id="calculateBtn">Refresh</button>
  <div id="result"></div>
  <div style="margin-top: 20px; font-size: 10px; color: #888; text-align: center;">
    Developed by praveen.ponduru
  </div>
  <script src="popup.js"></script>
</body>

</html>
